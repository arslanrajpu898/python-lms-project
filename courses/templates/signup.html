{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Python LMS</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>body { background-color: #f8f9fa; padding-top: 100px; text-align: center; }</style>
</head>
<body>
    <div class="container" style="max-width: 400px; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>📝 Create Account</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group" style="text-align: left;">
                    <label>{{ field.label }}</label>
                    <br>
                    {{ field }} <small style="color: grey; font-size: 10px;">{{ field.help_text }}</small>
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success btn-block btn-lg">Create Account</button>
        </form>
        <p style="margin-top: 20px;">Already a member? <a href="/login">Login here</a></p>
    </div>
</body>
</html>
