{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Python LMS</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>body { background-color: #f8f9fa; padding-top: 100px; text-align: center; }</style>
</head>
<body>
    <div class="container" style="max-width: 400px; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>🔐 Member Login</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control">
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
        </form>
        <p style="margin-top: 20px;">Don't have an account? <a href="/signup">Sign up here</a></p>
    </div>
</body>
</html>
